name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency: # Serialize deploys (`remove: true` syncs can't race), never cancel mid-upload
  group: deploy-site-to-cdn
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build-docs

      - name: Deploy to BunnyCDN
        uses: ayeressian/bunnycdn-storage-deploy@v2.4.6
        with:
          source: "dist"
          destination: ""
          storageZoneName: "${{ secrets.BUNNY_ZONE_NAME }}"
          storagePassword: "${{ secrets.BUNNY_PW_SITE }}"
          accessKey: "${{ secrets.BUNNY_API_KEY }}"
          pullZoneId: "${{ secrets.BUNNY_ZONE_ID }}"
          upload: "true"
          remove: "true"
          purgePullZone: "true"
          purgePullZoneDelay: "5"
          maxRetries: "5"